<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人办公工作台</title>
<style>
  :root{
    --bg:#f5f8f9; --panel:#ffffff; --ink:#1f2d3d; --muted:#6b7c8f; --line:#e3ebef;
    --teal:#0ea5a4; --teal-d:#0b8584; --blue:#1d8fb8; --blue-d:#156b8c;
    --red:#e5484d; --red-bg:#fdecec; --green:#16a34a; --amber:#f59e0b; --soft:#eef6f6;
    --shadow:0 2px 10px rgba(15,80,90,.06); --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  svg{display:block}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px}
  /* layout */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:226px;flex:0 0 226px;background:linear-gradient(180deg,#0f3b46,#0d2f38);
    color:#dfeef0;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700;font-size:16px;color:#fff}
  .brand .logo{width:30px;height:30px;flex:0 0 30px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#cfe2e4;
    text-decoration:none;font-size:14.5px;transition:.15s;min-height:44px;
  }
  .nav a svg{width:19px;height:19px;flex:0 0 19px;opacity:.9}
  .nav a:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav a.active{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;font-weight:600}
  .nav .grp{font-size:11px;letter-spacing:1px;color:#7fa3a8;margin:14px 12px 4px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .topbar h1{font-size:17px;margin:0;font-weight:700}
  .topbar .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .sync.ok .dot{background:var(--green)} .sync.saving .dot{background:var(--amber)} .sync.off .dot{background:#94a3b8}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:13.5px;min-height:40px;transition:.15s;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal-d)}
  .btn.primary{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;border:none}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .btn.danger{color:var(--red);border-color:#f3c9cb}
  .btn.ghost{background:transparent}
  .btn svg{width:16px;height:16px}
  .content{padding:18px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
  .col-main{min-width:0}
  .col-side{min-width:0}
  @media(max-width:980px){ .content{grid-template-columns:1fr} }
  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s;z-index:60;width:230px}
    .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .menu-btn{display:inline-flex!important}
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;display:none}
    .mask.show{display:block}
    .topbar{padding:10px 14px}
    .content{padding:14px 12px 60px}
  }
  .menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff}
  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .card h2 .ic{width:18px;height:18px;color:var(--teal)}
  .card .desc{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--teal-d)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.green{background:#e7f6ec;color:var(--green)}
  .pill.amber{background:#fff4e3;color:#b9740a}
  .pill.blue{background:#e7f1f7;color:var(--blue-d)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;background:#eef2f4;color:var(--muted);margin:2px}
  .tag.P0{background:#fdecec;color:var(--red)} .tag.P1{background:#fff4e3;color:#b9740a}
  .tag.P2{background:#e7f1f7;color:var(--blue-d)} .tag.P3{background:#eef2f4;color:var(--muted)}
  /* forms */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  .field textarea{min-height:92px;resize:vertical;line-height:1.5}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  /* lists */
  .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:.15s}
  .item:hover{border-color:#cfe3e3}
  .item.overdue{border-color:#f3c9cb;background:var(--red-bg)}
  .item.done{opacity:.62}
  .item .top{display:flex;align-items:flex-start;gap:10px}
  .item .top .body{flex:1;min-width:0}
  .item .title{font-weight:600;font-size:15px}
  .item .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .item .detail{color:#44566a;font-size:13px;margin-top:7px;white-space:pre-wrap;word-break:break-word}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .mini{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;min-height:36px;display:inline-flex;align-items:center;gap:5px}
  .mini:hover{border-color:var(--teal);color:var(--teal-d)}
  .mini.red{color:var(--red);border-color:#f3c9cb}
  .mini.on{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;border-color:transparent}
  .mini svg{width:14px;height:14px}
  .pwMask{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px}
  .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--teal);flex:0 0 22px;display:flex;align-items:center;justify-content:center;background:#fff;margin-top:1px}
  .check.on{background:var(--teal);border-color:var(--teal)}
  .check.on svg{width:14px;height:14px;color:#fff}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head .mt{font-weight:700;font-size:15px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-grid .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
  .cal-cell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-radius:9px;font-size:13px;color:var(--ink);background:#fafdfd;border:1px solid transparent;cursor:pointer;min-height:38px}
  .cal-cell:hover{border-color:#bfe0e0}
  .cal-cell.dim{color:#c2ccd1;background:transparent}
  .cal-cell.today{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700}
  .cal-cell.sel{border-color:var(--teal);box-shadow:0 0 0 2px rgba(14,165,164,.25)}
  .cal-cell.rng{background:var(--soft)}
  .cal-cell .dots{position:absolute;bottom:4px;display:flex;gap:2px}
  .cal-cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
  .cal-cell .hol{position:absolute;top:2px;right:3px;font-size:9px;color:var(--red)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 12px;font-size:12.5px;color:var(--muted)}
  .seg button.on{background:var(--teal);color:#fff}
  /* day detail */
  .dd-section{margin-bottom:12px}
  .dd-section .h{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .dd-item{font-size:13px;padding:6px 9px;border-radius:8px;background:#f7fbfb;margin-bottom:5px;border-left:3px solid var(--teal)}
  .dd-item.red{border-left-color:var(--red);background:var(--red-bg)}
  .dd-item small{color:var(--muted)}
  /* charts */
  .charts{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .legend{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
  /* banner */
  .banner{background:#fff7e8;border:1px solid #f3d79a;color:#8a5a00;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px}
  /* timeline */
  .tl{position:relative;padding-left:22px}
  .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .ev{position:relative;margin-bottom:14px}
  .tl .ev:before{content:"";position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
  .tl .ev.red:before{border-color:var(--red)} .tl .ev.amber:before{border-color:var(--amber)} .tl .ev.green:before{border-color:var(--green)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,30,35,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;margin:auto}
  .modal h3{margin:0 0 14px;font-size:17px}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}
  .hero{height:120px;border-radius:var(--radius);overflow:hidden;margin-bottom:16px;position:relative}
  .hero svg{width:100%;height:100%}
  .hero .t{position:absolute;left:18px;bottom:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.3)}
  .hero .t b{font-size:19px;display:block}
  .hero .t span{font-size:12.5px;opacity:.92}
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:6px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .n{font-size:24px;font-weight:800;color:var(--teal-d)}
  .stat .l{font-size:12px;color:var(--muted)}
  .todo-group-h{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
  .todo-group-h.red{color:var(--red)}
  .linkbox{font-size:12.5px;color:var(--blue-d);background:#eef6f8;border:1px solid #cfe6ef;border-radius:8px;padding:8px 10px;margin-top:8px}
  .chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
  .chk input{width:16px;height:16px;accent-color:var(--teal)}
  .summary-box{white-space:pre-wrap;background:#f7fbfb;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.6;color:#33464f}
  .insp-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
  .insp-text{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#22343c;flex:1}
  .advice-box{margin-top:10px;border-left:3px solid var(--teal);background:#f3fbfb;border-radius:0 10px 10px 0;padding:10px 12px}
  .advice-h{font-weight:700;font-size:13px;color:var(--teal-d);margin-bottom:4px}
  .advice-sub{font-size:12.5px;color:var(--muted);margin:8px 0 4px}
  .advice-list{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#33464f}
  .advice-list.q{color:var(--blue-d)}
  .advice-fb{font-size:13px;color:#33464f;margin-top:8px;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
  .mtab{display:inline-flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .mtab button{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:13px;color:var(--muted);min-height:38px}
  .mtab button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:18px}
  .topcard .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.topcard .cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="mask" id="mask"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="3" fill="#0ea5a4"/><path d="M7 8h10M7 12h7M7 16h5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      办公工作台
    </div>
    <nav class="nav" id="nav">
      <a href="#" data-view="overview"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" fill="#fff"/><rect x="14" y="3" width="7" height="5" rx="1.5" fill="#fff"/><rect x="14" y="11" width="7" height="10" rx="1.5" fill="#fff"/><rect x="3" y="15" width="7" height="6" rx="1.5" fill="#fff"/></svg>工作台首页</a>
      <div class="grp">核心模块</div>
      <a href="#" data-view="todo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M18 16l2 2 3-3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>今日待办</a>
      <a href="#" data-view="project"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7l9-4 9 4-9 4-9-4z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>项目跟进</a>
      <a href="#" data-view="monthly"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="#fff" stroke-width="1.7"/><path d="M3 9h18M8 2v4M16 2v4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>月度重点</a>
      <a href="#" data-view="reminder"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 7-2 7h16s-2-2-2-7a6 6 0 0 0-6-6z" stroke="#fff" stroke-width="1.7"/><path d="M10 20a2 2 0 0 0 4 0" stroke="#fff" stroke-width="1.7"/></svg>重要提醒</a>
      <a href="#" data-view="happy"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.7"/><path d="M8.5 14a4 4 0 0 0 7 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="9.5" r="1.1" fill="#fff"/><circle cx="15" cy="9.5" r="1.1" fill="#fff"/></svg>生活助手</a>
      <a href="#" data-view="accounts"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#fff" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="15" r="1.6" fill="#fff"/></svg>IT账号信息</a>
      <a href="#" data-view="team"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="#fff" stroke-width="1.7"/><circle cx="17" cy="9" r="2.3" stroke="#fff" stroke-width="1.7"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M14.5 19a4.5 4.5 0 0 1 6.5-4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>周团队管理</a>
      <a href="#" data-view="summary"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V9M12 19V5M19 19v-7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>工作总结</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#1f2d3d" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div>
        <h1 id="pageTitle">工作台首页</h1>
        <div class="sub" id="pageSub">数据本地自动保存 · 已接入资料库在线同步</div>
      </div>
      <div class="spacer"></div>
      <div class="sync off" id="syncBox"><span class="dot"></span><span id="syncTxt">本地模式</span></div>
      <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>导出备份</button>
      <button class="btn" id="btnImport"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>导入</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>

    <div class="content">
      <div class="col-main" id="colMain"></div>
      <div class="col-side">
        <div class="card">
          <div class="cal-head">
            <button class="mini" id="calPrev"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="mt" id="calMonth"></div>
            <button class="mini" id="calNext"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="seg" style="margin-bottom:8px">
            <button id="segDay" class="on">选日期</button>
            <button id="segRange">选时间段</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="hint" id="calHint">点击日期查看当天工作；切到「选时间段」可框选一段区间做汇总。</div>
        </div>
        <div class="card" id="dayDetail"></div>
      </div>
    </div>
    <footer>个人办公工作台 · 单文件离线可用 · 数据存本地并同步资料库 · <span id="verTxt"></span></footer>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============ 资料库在线同步层 ============ */
var DATABASE_ID = 'szDPLyBwI3EkJ7p024n5SG';
var SYNC = {
  recordId: null,
  busyt: false,
  available: function(){ return !!(window.__SMART_PAGE__ && window.__SMART_PAGE__.database); },
  ensure: function(){
    if(this.recordId) return;
    try{ this.recordId = localStorage.getItem('wb_office_record_id') || null; }catch(e){}
  },
  load: function(){
    var self=this; this.ensure();
    if(!self.available()) return Promise.resolve(null);
    return window.__SMART_PAGE__.database.query({
      databaseId: DATABASE_ID,
      filter:{property:{property:'key', text:{equals:'default'}}},
      pageSize:1
    }).then(function(res){
      var row = res && res.results && res.results[0];
      if(row){
        self.recordId = row._id;
        try{ localStorage.setItem('wb_office_record_id', row._id); }catch(e){}
        try{ return JSON.parse(row.state); }catch(e){ return null; }
      }

function lunarDate(y,m,d){
  if(y<1900||y>2049) return null;

  var i, temp=0, leap=0;

  for(i=1;i<13 && offset>0;i++){
    if(lm>0 && i==(lm+1) && !isLeap){ isLeap=true; temp=leapDays(ly); }
    else { temp=monthDays(ly,i); }
    if(offset<temp) break;
    offset-=temp;
    if(isLeap && i==(lm+1)) isLeap=false;
    lmon=i;
  }
  if(isLeap && i==(lm+1)) lmon=lm; else if(i>12) lmon=12; else lmon=i;

function compressImage(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=800; var scale=Math.min(1, maxW/img.width);
      var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ cb(canvas.toDataURL('image/jpeg',0.82)); }catch(err){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=e.target.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}

function computeToday(){
  var t=todayStr(); var r={overdueTodos:[],stuckProjects:[],todayReminders:[],futureTodos:[]};
  App.state.todos.forEach(function(o){
    if(o.done) return;
    var d=dayPart(o.deadline);
    if(cmpDate(d,t)<0) r.overdueTodos.push(o);
    else r.futureTodos.push(o);
  });
  App.state.projects.forEach(function(p){ if(p.stuck&&p.stuck.trim()) r.stuckProjects.push(p); });
  App.state.reminders.forEach(function(rm){ if(dayPart(rm.date)===t) r.todayReminders.push(rm); });
  return r;
}

function renderCalendar(){
  var ym=App.calMonth; var y=+ym.slice(0,4),m=+ym.slice(5,7);
  $('#calMonth').textContent=y+'年'+m+'月';
  var first=new Date(y,m-1,1).getDay(); var days=new Date(y,m,0).getDate();
  var dow=['一','二','三','四','五','六','日'];
  var g='';
  dow.forEach(function(d){g+='<div class="dow">'+d+'</div>';});
  var lead=(first+6)%7;
  for(var i=0;i<lead;i++){ g+='<div class="cal-cell dim"></div>'; }
  for(var d=1;d<=days;d++){
    var ds=ym+'-'+pad(d); var cls='cal-cell';
    if(ds===todayStr())cls+=' today';
    if(ds===App.selDate)cls+=' sel';
    if(App.rangeMode&&App.rangeStart&&App.rangeEnd&&inRange(ds,App.rangeStart,App.rangeEnd))cls+=' rng';
    var dots='';
    var cnt=dayItemCount(ds);
    if(cnt.t)dots+='<i style="background:#0ea5a4"></i>';
    if(cnt.p)dots+='<i style="background:#e5484d"></i>';
    if(cnt.r)dots+='<i style="background:#1d8fb8"></i>';
    if(cnt.e)dots+='<i style="background:#f59e0b"></i>';
    var hol=holidayOf(ds);
    g+='<div class="'+cls+'" data-date="'+ds+'">'+(hol?'<span class="hol">假</span>':'')+d+'<span class="dots">'+dots+'</span></div>';
  }
  $('#calGrid').innerHTML=g;
}
function dayItemCount(ds){
  var c={t:0,p:0,r:0,e:0};
  App.state.todos.forEach(function(o){ if(!o.done && dayPart(o.deadline)===ds)c.t++; });
  App.state.projects.forEach(function(p){ if(dayPart(p.delivery)===ds)c.p++; });
  App.state.reminders.forEach(function(rm){ if(dayPart(rm.date)===ds)c.r++; });
  App.state.events.forEach(function(e){ if(evOverlap(ds,ds,e.start,e.end))c.e++; });
  return c;
}

/* ============ 图表（内联 SVG） ============ */
function ring(percent,r){
  r=r||46; var c=2*Math.PI*r; var off=c*(1-percent/100);
  return '<svg width="'+(r*2+8)+'" height="'+(r*2+8)+'" viewBox="0 0 '+(r*2+8)+' '+(r*2+8)+'"><circle cx="'+(r+4)+'" cy="'+(r+4)+'" r="'+r+'" stroke="#eef2f4" stroke-width="7" fill="none"/><circle cx="'+(r+4)+'" cy="'+(r+4)+'" r="'+r+'" stroke="url(#rg)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+(r+4)+' '+(r+4)+')"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5a4"/><stop offset="1" stop-color="#1d8fb8"/></linearGradient></defs><text x="'+(r+4)+'" y="'+(r+4)+'" text-anchor="middle" dy="5" font-size="16" font-weight="700" fill="#0b8584">'+percent+'%</text></svg>';
}
function donut(data){
  // data: [{label,value,color}]
  var total=data.reduce(function(a,b){return a+b.value;},0);
  if(total===0) return '<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="58" fill="none" stroke="#eef2f4" stroke-width="16"/></svg>';
  var r=58,c=2*Math.PI*r,acc=0,segs='';
  data.forEach(function(d){ var len=c*d.value/total; segs+='<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="16" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+( -acc )+'" transform="rotate(-90 75 75)"/></circle>'; acc+=len; });
  return '<svg width="150" height="150" viewBox="0 0 150 150">'+segs+'</svg>';
}
function bars(data){
  if(!data.length)return '<div class="empty">暂无数据</div>';
  var max=Math.max.apply(null,data.map(function(d){return d.value;}).concat([1]));
  var h='<div style="display:flex;gap:14px;align-items:flex-end;height:150px;padding:6px 2px">';
  data.forEach(function(d){ var bh=Math.round(d.value/max*120); if(d.value===0)bh=2;
    h+='<div style="flex:1;text-align:center"><div style="height:'+bh+'px;background:linear-gradient(180deg,#0ea5a4,#1d8fb8);border-radius:6px 6px 0 0;min-height:2px"></div><div style="font-size:11px;color:#6b7c8f;margin-top:4px">'+esc(d.label)+'</div><div style="font-size:12px;font-weight:700;color:#0b8584">'+d.value+'</div></div>';
  });
  return h+'</div>';
}

  html+='<div class="top"><div class="check'+(o.done?' on':'')+'" data-toggle="monthly" data-id="'+o.id+'">'+(o.done?'<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+'</div>';
  html+='<div class="body"><div class="title">'+esc(o.title)+' <span class="tag '+o.importance+'">'+(o.importance||'')+'</span></div>';
  html+='<div class="meta">';
  if(o.owner)html+='<span>负责人：'+esc(o.owner)+'</span>';
  if(o.duration)html+='<span>时长：'+esc(o.duration)+'</span>';
  if(o.deadline)html+='<span>截止：'+esc(fmtDateTime(o.deadline))+'</span>';
  if(o.deferCount)html+='<span class="pill amber">已顺延'+o.deferCount+'次</span>';
  if(o.done&&o.doneTime)html+='<span class="pill green">已完成 '+esc(o.doneTime)+'</span>';
  html+='</div>';
  if(o.detail)html+='<div class="detail">'+esc(o.detail)+'</div>';
  html+='</div></div>';
  html+='<div class="acts">';
  if(!o.done&&cmpDate(dayPart(o.deadline)||'9999',todayStr())<0) html+='<button class="mini red deferMonth" data-id="'+o.id+'">顺延到下个月</button>';
  html+='<button class="mini editItem" data-type="monthly" data-id="'+o.id+'">编辑</button>';
  html+='<button class="mini red delItem" data-type="monthly" data-id="'+o.id+'">删除</button>';
  html+='</div></div>';
  return html;
}

function summaryContent(s,e,kind){
  var todos=App.state.todos.filter(function(o){return inRange(o.deadline,s,e);});
  var done=todos.filter(function(o){return o.done;});
  var dist=impDist(todos);
  // 精力花在哪些项目（按关联待办 + 项目交付落在区间）
  var projMap={};
  App.state.projects.forEach(function(p){
    var projHit = inRange(p.delivery,s,e) || (p.todoIds||[]).some(function(tid){ var to=App.state.todos.find(function(x){return x.id===tid;}); return to&&inRange(to.deadline,s,e); });
    if(projHit) projMap[p.name]=(projMap[p.name]||0)+1;
  });
  // 卡点：卡住项目 + 逾期未完成
  var blocked=App.state.projects.filter(function(p){return (p.stuck&&p.stuck.trim())&&inRange(p.delivery,s,e);});
  var overdue=App.state.todos.filter(function(o){return !o.done&&cmpDate(o.deadline,e)<0&&cmpDate(o.deadline,s)>=0;});
  var html='';
  html+='<div class="stat-cards">';
  html+='<div class="stat"><div class="n" data-sp-bindable="database" data-sp-database-id="szDPLyBwI3EkJ7p024n5SG">'+done.length+'</div><div class="l">完成事项</div></div>';
  html+='<div class="stat"><div class="n" data-sp-bindable="database" data-sp-database-id="szDPLyBwI3EkJ7p024n5SG">'+todos.length+'</div><div class="l">区间内事项</div></div>';
  html+='<div class="stat"><div class="n" data-sp-bindable="database" data-sp-database-id="szDPLyBwI3EkJ7p024n5SG">'+blocked.length+'</div><div class="l">卡点项目</div></div>';

    if(f.t==='textarea') html+='<textarea data-f="'+f.k+'" placeholder="'+(f.ph||'')+'">'+esc(val)+'</textarea>';
    else if(f.t==='select'){ var sopts=f.opts||(f.optsFrom?App.state[f.optsFrom]||[]:[]); html+='<select data-f="'+f.k+'">'; sopts.forEach(function(o){ html+='<option'+(o==val?' selected':'')+'>'+esc(o)+'</option>'; }); html+='</select>'; }

    if(!item){ obj.id=uid(); obj.createdAt=Date.now(); obj.demo=false;
      if(type==='todo'||type==='monthly'){obj.done=false;obj.doneTime=null;obj.deferCount=0;}
      (App.state[type+'s']||App.state[type]).push(obj);
    } else {
      var arr=App.state[type+'s']||App.state[type]; var idx=arr.findIndex(function(x){return x.id===id;});

function deferMonthly(id){ var o=App.state.monthly.find(function(x){return x.id===id;}); if(!o)return; o.deadline=addMonths(o.deadline||todayStr(),1); o.deferCount=(o.deferCount||0)+1; save(); renderAll(); flash('已顺延到下个月（第'+o.deferCount+'次）'); }

  if(n>=th&&App.state.meta.sample===false|| (n>=th)){
    var b=document.createElement('div'); b.id='backupBanner'; b.className='banner';
    b.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="#b9740a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 数据已积累 '+n+' 条，建议点右上角「导出备份」存一份，换手机/清浏览器也不怕丢。';
    $('#colMain').insertBefore(b,$('#colMain').firstChild);
  }
}

/* ============ 渲染全部 ============ */
function renderAll(){
  renderView(); renderCalendar(); renderDayDetail();
  // 顶部「今天要处理」插入到 colMain 第二张卡
  var main=$('#colMain');
  var existing=$('#todayTopCard'); if(existing)existing.remove();
  if(App.view!=='overview' && App.view!=='happy' && App.view!=='accounts'){
    var div=document.createElement('div'); div.id='todayTopCard'; div.innerHTML=renderTopCard();
    main.insertBefore(div, main.firstChild.nextSibling||main.firstChild);
    bindTopCard(div);
  } else {
    bindTopCard(main);
  }
  bindViewEvents();
  checkBackupReminder();
  updateSyncUI();
}
function bindTopCard(scope){
  $all('.deferOne',scope).forEach(function(el){ el.onclick=function(e){e.preventDefault();deferTodo(el.dataset.id);}; });
}

/* ============ 初始化 ============ */
function init(){
  $('#verTxt').textContent='v1.0 · 资料库 '+DATABASE_ID.slice(0,6);
  loadState();
  App.accounts=loadAccounts(); // IT账号信息：独立本机存储，不参与云端同步
  // 导航
  $all('#nav a').forEach(function(a){ a.onclick=function(e){e.preventDefault(); App.view=a.dataset.view; $all('#nav a').forEach(function(x){x.classList.remove('active');}); a.classList.add('active'); closeSidebar(); renderAll(); window.scrollTo(0,0);}; });
  // 菜单
  $('#menuBtn').onclick=function(){$('#sidebar').classList.add('open');$('#mask').classList.add('show');};
  $('#mask').onclick=function(){$('#sidebar').classList.remove('open');$('#mask').classList.remove('show');};
  // 日历
  $('#calPrev').onclick=function(){var y=+App.calMonth.slice(0,4),m=+App.calMonth.slice(5,7);m--;if(m<1){m=12;y--;}App.calMonth=y+'-'+pad(m);renderCalendar();};
  $('#calNext').onclick=function(){var y=+App.calMonth.slice(0,4),m=+App.calMonth.slice(5,7);m++;if(m>12){m=1;y++;}App.calMonth=y+'-'+pad(m);renderCalendar();};
  $('#segDay').onclick=function(){App.rangeMode=false;App.rangeStart=App.rangeEnd=null;$('#segDay').classList.add('on');$('#segRange').classList.remove('on');$('#calHint').textContent='点击日期查看当天工作；切到「选时间段」可框选一段区间做汇总。';renderCalendar();renderDayDetail();};
  $('#segRange').onclick=function(){App.rangeMode=true;App.rangeStart=App.rangeEnd=null;$('#segRange').classList.add('on');$('#segDay').classList.remove('on');$('#calHint').textContent='依次点击两个日期，框选一段工作时间段。';renderCalendar();renderDayDetail();};
  // 日历点击委托
  $('#calGrid').addEventListener('click',function(e){ var c=e.target.closest('.cal-cell'); if(!c||!c.dataset.date)return; var ds=c.dataset.date;
    if(App.rangeMode){ if(!App.rangeStart||(App.rangeStart&&App.rangeEnd)){App.rangeStart=ds;App.rangeEnd=null;} else {App.rangeEnd=ds;} }
    else { App.selDate=ds; }
    renderCalendar(); renderDayDetail();
  });
  // 导出
  $('#btnExport').onclick=function(){
    var data={app:'office-workbench',version:1,exportedAt:new Date().toISOString(),state:App.state};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='办公工作台备份_'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
    flash('已导出备份');
  };
  // 导入
  $('#btnImport').onclick=function(){$('#fileInput').click();};
  $('#fileInput').onchange=function(e){ var f=e.target.files[0]; if(!f)return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=JSON.parse(rd.result); var st=d.state||d; if(!st||typeof st!=='object')throw 0;
      ['todos','projects','monthly','events','reminders','team','inspirations','meds','homeTasks'].forEach(function(k){if(!st[k])st[k]=[];});
      App.state=st; App.state.meta=App.state.meta||{}; App.state.meta.sample=false; try{localStorage.removeItem('wb_office_record_id');SYNC.recordId=null;}catch(e){} save(); renderAll(); flash('导入成功，共 '+totalCount()+' 条'); }
      catch(err){ alert('文件格式不正确，导入失败。'); } };
    rd.readAsText(f); e.target.value='';
  };
  // 默认视图
  $all('#nav a')[0].classList.add('active');
  // 关键修复：先本地渲染，保证首屏一定可用，绝不阻塞在云端请求上
  updateSyncUI('off');
  renderAll();   // 内部已包含 appendClearSample（示例数据入口）
  // 后台同步：异步拉取云端最新数据，成功后再覆盖渲染；
  // 即使云端查询挂起 / 报错，已经显示的内容也不会消失（不再出现整页空白）
  if(SYNC.available()){
    try {
      SYNC.load()
        .then(function(cloud){
          if(cloud && cloud.todos!==undefined){ App.state=cloud; saveLocal(); renderAll(); }
          else if(App.state && (!App.state.meta || App.state.meta.sample!==true)){
            // 云端空、本地有真实数据：自动把本地数据备份回云端，防止换设备后丢失
            SYNC.save(App.state);
          }
          updateSyncUI('ok');
        })
        .catch(function(){ updateSyncUI('off'); });
    } catch(e){ updateSyncUI('off'); }
  }
}
function addClearSample(){
  if(!App.state.meta.sample) return;
  var b=document.createElement('div'); b.className='card';
  b.innerHTML='<h2>示例数据</h2><div class="hint">当前展示的是示例内容。你可以直接修改或新增，所有改动都会自动保存。准备用自己的数据时，点下面的按钮清空示例。</div><button class="btn danger" id="clearSample">清空示例数据</button>';
  // 挂到首页
  var m=$('#colMain');
  b.querySelector('#clearSample').onclick=function(){ if(!confirm('清空所有示例数据？你自己的数据不会受影响（示例已单独标记）。'))return;
    ['todos','projects','monthly','events','reminders','team','inspirations','meds','homeTasks'].forEach(function(k){ App.state[k]=App.state[k].filter(function(x){return !x.demo;}); });
    App.accounts=(App.accounts||[]).filter(function(x){return !x.demo;}); saveAccountsLocal(App.accounts);
    App.state.meta.sample=false; save(); renderAll(); flash('已清空示例数据');
  };
  // 只在 overview 时显示，重渲染时处理
  if(App.view==='overview') m.appendChild(b);
  // 用 MutationObserver 太重，改为在 renderAll 中调用
}
// 重写 addClearSample 挂载逻辑到 renderAll
var _origRenderAll=renderAll;
renderAll=function(){ _origRenderAll(); appendClearSample(); };
function appendClearSample(){
  if(App.view!=='overview')return;
  if(!App.state.meta.sample)return;
  if($('#clearSample'))return;
  var m=$('#colMain'); var b=document.createElement('div'); b.className='card';
  b.innerHTML='<h2>示例数据</h2><div class="hint">当前展示示例内容，可直接修改或新增，改动自动保存。准备用自己的数据时，点下方按钮清空示例。</div><button class="btn danger" id="clearSample">清空示例数据</button>';
  b.querySelector('#clearSample').onclick=function(){ if(!confirm('清空所有示例数据？（你自己新增的数据不受影响）'))return;
    ['todos','projects','monthly','events','reminders','team','inspirations','meds','homeTasks'].forEach(function(k){ App.state[k]=App.state[k].filter(function(x){return !x.demo;}); });
    App.accounts=(App.accounts||[]).filter(function(x){return !x.demo;}); saveAccountsLocal(App.accounts);
    App.state.meta.sample=false; save(); renderAll(); flash('已清空示例数据');
  };
  m.appendChild(b);
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
